name: Executar API
on:
  schedule:
    # Base - todos os dias (2x) - compensado com atraso médio real (17 amostras)
    - cron: '42 3 * * *'    # agenda 00:42 BR -> tende a rodar ~07:20 BR
    - cron: '20 11 * * *'   # agenda 08:20 BR -> tende a rodar ~13:20 BR

    # Extra sexta-feira (dow=5) -> total 4x nas sextas
    - cron: '22 6 * * 5'    # agenda 03:22 BR -> tende a rodar ~10:00 BR
    - cron: '0 14 * * 5'    # agenda 11:00 BR -> tende a rodar ~16:00 BR

    # Extra dias 30/31 (dom=30,31) -> total 6x nesses dias
    - cron: '22 4 30,31 * *'   # agenda 01:22 BR -> tende a rodar ~08:00 BR
    - cron: '22 7 30,31 * *'   # agenda 04:22 BR -> tende a rodar ~11:00 BR
    - cron: '0 14 30,31 * *'   # agenda 11:00 BR -> tende a rodar ~16:00 BR
    - cron: '0 16 30,31 * *'   # agenda 13:00 BR -> tende a rodar ~18:00 BR
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: api-pipeline
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests pandas gspread oauth2client google-api-python-client google-auth
      - name: Create credentials file
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > teste-477018-5cb1426a435b.json
      - name: Run script
        run: python API_MB1.py
        env:
          TOKEN_SGA: ${{ secrets.TOKEN_SGA }}
          USUARIO_API: ${{ secrets.USUARIO_API }}
          SENHA_API: ${{ secrets.SENHA_API }}
          TOKEN_CRM: ${{ secrets.TOKEN_CRM }}
